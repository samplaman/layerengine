name: Continuous Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev \
            libxext-dev libxrandr-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev freeglut3-dev

      - name: Import Certificate
        if: matrix.platform == 'macOS'
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security delete-keychain build.keychain || true
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXTRAS=OFF

      - name: Build Plugin
        run: cmake --build build --config Release --parallel 4

      - name: Import Apple Certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          security create-keychain -p "" build.keychain
          security import <(echo $CERTIFICATE_P12 | base64 --decode) -f pkcs12 -k build.keychain -P $CERTIFICATE_PASSWORD -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          
          # Debug: List available identities to verify import
          security find-identity -v -p codesigning

      - name: Prepare Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          # Find VST3
          VST_PATH=$(find build/LayerEngine_artefacts -name "LayerEngine.vst3" -type d | head -n 1)
          # Find CLAP
          CLAP_PATH=$(find build/LayerEngine_artefacts -name "LayerEngine.clap" | head -n 1)
          # Find Standalone (Linux binary)
          STANDALONE_PATH=$(find build/LayerEngine_artefacts -name "LayerEngine" -type f | head -n 1)
          # Find AU (macOS only)
          AU_PATH=$(find build/LayerEngine_artefacts -name "LayerEngine.component" -type d | head -n 1)
          # Find App Bundle (macOS only)
          APP_PATH=$(find build/LayerEngine_artefacts -name "LayerEngine.app" -type d | head -n 1)
          
          if [ -d "$VST_PATH" ]; then cp -r "$VST_PATH" artifacts/; fi
          if [ -n "$CLAP_PATH" ]; then cp -r "$CLAP_PATH" artifacts/; fi
          if [ -f "$STANDALONE_PATH" ]; then cp "$STANDALONE_PATH" artifacts/; fi
          if [ -d "$AU_PATH" ]; then cp -r "$AU_PATH" artifacts/; fi
          if [ -d "$APP_PATH" ]; then cp -r "$APP_PATH" artifacts/; fi
          
          # Platform-specific packaging
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            chmod +x build_mac_installer.sh
            # Export secret as environment variable for the script
            export APPLE_DEVELOPER_ID="${{ secrets.APPLE_DEVELOPER_ID }}"
            ./build_mac_installer.sh
            
            # Notarize
            xcrun notarytool submit LayerEngine-Installer.pkg \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_NOTARIZATION_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --wait
            
            # Staple
            xcrun stapler staple LayerEngine-Installer.pkg
            
            mkdir -p final_zip
            cp LayerEngine-Installer.pkg final_zip/
            cd final_zip && zip -r ../LayerEngine-macOS.zip .
          else
            # Linux
            chmod +x build_linux_installer.sh
            ./build_linux_installer.sh
            
            # Create a universal package too
            mkdir -p universal
            cp artifacts/LayerEngine universal/
            cp -r artifacts/LayerEngine.vst3 universal/
            cp assets/logo.png universal/
            cp install.sh universal/
            
            # deb zip
            mkdir -p deb_zip
            cp LayerEngine-Installer.deb deb_zip/
            cd deb_zip && zip -r ../LayerEngine-Linux-Debian.zip .
            cd ..
            
            # universal zip
            cd universal && zip -r ../LayerEngine-Linux-Universal.zip .
            cd ..

            # clap direct asset
            if [ -e "artifacts/LayerEngine.clap" ]; then
              cp -r artifacts/LayerEngine.clap LayerEngine-Linux.clap
            fi
          fi



      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Prepare Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $vst = Get-ChildItem -Path build/LayerEngine_artefacts -File -Filter "LayerEngine.vst3" -Recurse | Select-Object -First 1
          $exe = Get-ChildItem -Path build/LayerEngine_artefacts -Filter "LayerEngine.exe" -Recurse | Select-Object -First 1
          
          if ($vst) {
              Copy-Item -Path $vst.FullName -Destination artifacts/
          }
          if ($exe) { Copy-Item -Path $exe.FullName -Destination artifacts/ }
          
          # Build Installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          
          # Package Installer into Zip
          New-Item -ItemType Directory -Force -Path installer_dist
          Copy-Item -Path LayerEngine-Installer.exe -Destination installer_dist/
          Compress-Archive -Path installer_dist/* -DestinationPath LayerEngine-Windows-Installer.zip
          
          # Package Portable Artifacts (Standalone + VST3) into Zip
          Compress-Archive -Path artifacts/* -DestinationPath LayerEngine-Windows.zip

          # Package VST3 alone into its own Zip
          if ($vst) {
              Compress-Archive -Path $vst.FullName -DestinationPath LayerEngine-Windows-VST3.zip
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LayerEngine-${{ matrix.platform }}
          path: |
            LayerEngine-*.zip
            LayerEngine-*.clap
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Set Release Tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          else
            echo "TAG_NAME=latest" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Update Tag Reference
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${process.env.TAG_NAME}`,
                sha: context.sha,
                force: true
              })
            } catch (e) {
              console.log("Tag might not exist yet, it will be created by the release step.");
            }

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: LayerEngine ${{ env.TAG_NAME }}
          files: |
            LayerEngine-Linux/LayerEngine-Linux-Universal.zip
            LayerEngine-Linux/LayerEngine-Linux-Debian.zip
            LayerEngine-Linux/LayerEngine-Linux.clap
            LayerEngine-macOS/LayerEngine-macOS.zip
            LayerEngine-Windows/LayerEngine-Windows.zip
            LayerEngine-Windows/LayerEngine-Windows-VST3.zip
            LayerEngine-Windows/LayerEngine-Windows-Installer.zip
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
